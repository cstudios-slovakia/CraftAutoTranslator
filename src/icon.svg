<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="100" height="50" rx="20" fill="url(#shine)"/>

  <!-- Globe outline -->
  <circle cx="50" cy="42" r="22" stroke="white" stroke-width="2.5"/>

  <!-- Globe meridian (vertical ellipse) -->
  <ellipse cx="50" cy="42" rx="11" ry="22" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Globe equator -->
  <line x1="28" y1="42" x2="72" y2="42" stroke="white" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Tropic arc hints -->
  <path d="M31,31 Q50,25 69,31" stroke="white" stroke-width="1.3" stroke-opacity="0.45" fill="none"/>
  <path d="M31,53 Q50,59 69,53" stroke="white" stroke-width="1.3" stroke-opacity="0.45" fill="none"/>

  <!-- AI sparkle — top-right corner (outside globe) -->
  <g opacity="0.95">
    <line x1="80" y1="13" x2="80" y2="19" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="77" y1="16" x2="83" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="77.9" y1="13.9" x2="82.1" y2="18.1" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="82.1" y1="13.9" x2="77.9" y2="18.1" stroke="white" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.6"/>
    <circle cx="80" cy="16" r="1.2" fill="white"/>
  </g>

  <!-- Small second sparkle — top-left (decorative) -->
  <g opacity="0.5">
    <line x1="20" y1="17" x2="20" y2="21" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="19" x2="22" y2="19" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Translation arrows (stacked bidirectional — ⇄ symbol) -->
  <!-- Arrow 1: left → right -->
  <path d="M20,73 H60" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M54,67 L60,73 L54,79" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow 2: right → left -->
  <path d="M80,85 H40" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M46,79 L40,85 L46,91" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
